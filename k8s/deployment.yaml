apiVersion: apps/v1
kind: Deployment
metadata:
  name: nmccarthy-project-jul-26
  namespace: nmccarthy-project-jul-26
  labels:
    app: nmccarthy-project-jul-26
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nmccarthy-project-jul-26
  template:
    metadata:
      labels:
        app: nmccarthy-project-jul-26
    spec:
      containers:
        - name: solitaire
          image: jedicraft/nmccarthy-project-jul-26:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
