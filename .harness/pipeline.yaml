pipeline:
  name: nmccarthy-project-jul-26-ci-cd
  identifier: nmccarthy_project_jul_26_ci_cd
  orgIdentifier: sandbox
  projectIdentifier: NMcCarthy_Sandbox
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: jedicraftGitHub
        repoName: nmccarthy-project-jul-26
        build:
          type: branch
          spec:
            branch: main
  stages:
    - stage:
        name: build test scan and publish
        identifier: ci
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  name: Install dependencies
                  identifier: install
                  type: Run
                  spec:
                    image: node:22-alpine
                    shell: Sh
                    command: npm ci
              - step:
                  name: Run tests
                  identifier: unit_test
                  type: Run
                  spec:
                    image: node:22-alpine
                    shell: Sh
                    command: npm test
              - step:
                  name: Install dependencies
                  identifier: security_install
                  type: Run
                  spec:
                    image: node:22-alpine
                    shell: Sh
                    command: npm ci
              - step:
                  name: Snyk Scan
                  identifier: snyk_scan
                  template:
                    templateRef: NJMSynk
                    versionLabel: v1
              - step:
                  name: SonarQube Scan
                  identifier: sonarqube_scan
                  template:
                    templateRef: NJMSonarQube
                    versionLabel: v1
                    templateInputs:
                      type: Sonarqube
                      spec:
                        mode: orchestration
                        config: default
                        target:
                          type: repository
                          detection: auto
                        advanced:
                          log:
                            level: info
                          args:
                            cli: "-Dsonar.organization=jedicraft -Dsonar.projectKey=nmccarthy-project-jul-26 -Dsonar.sources=src"
                        auth:
                          access_token: <+secrets.getValue("sonarqube_token")>
                          domain: https://sonarcloud.io
                          ssl: true
              - step:
                  name: Build and Push Image
                  identifier: build_push
                  type: BuildAndPushDockerRegistry
                  timeout: 30m
                  spec:
                    connectorRef: DockerHub
                    repo: jedicraft/nmccarthy-project-jul-26
                    tags:
                      - latest
                      - <+pipeline.sequenceId>
                    dockerfile: Dockerfile
                    context: .
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: MarkAsFailure
    - stage:
        name: deploy and undeploy k8s
        identifier: deploy_k8s
        type: Deployment
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: nmccarthy_project_jul_26
            serviceInputs:
              serviceDefinition:
                type: Kubernetes
                spec:
                  artifacts:
                    primary:
                      primaryArtifactRef: docker_image
                      sources:
                        - identifier: docker_image
                          type: DockerRegistry
                          spec:
                            connectorRef: DockerHub
                            imagePath: jedicraft/nmccarthy-project-jul-26
                            tag: latest
                  manifests:
                    - manifest:
                        identifier: k8s_manifests
                        type: K8sManifest
                        spec:
                          store:
                            type: Github
                            spec:
                              connectorRef: jedicraftGitHub
                              gitFetchType: Branch
                              paths:
                                - k8s/
                              repoName: nmccarthy-project-jul-26
                              branch: main
                          skipResourceVersioning: false
                          enableDeclarativeRollback: false
          environment:
            environmentRef: nmccarthylocal
            deployToAll: false
            infrastructureDefinitions:
              - identifier: nmccarthy_rancher_desktop
          execution:
            steps:
              - step:
                  name: Deploy to Kubernetes
                  identifier: k8s_apply
                  type: ShellScript
                  timeout: 10m
                  spec:
                    shell: Bash
                    onDelegate: true
                    delegateSelectors:
                      - nmccarth-rancher-desktop-delegate
                    source:
                      type: Inline
                      spec:
                        script: |
                          set -e
                          rm -rf /tmp/nmccarthy-project-jul-26
                          git clone --depth 1 --branch main https://github.com/jedicraft/nmccarthy-project-jul-26.git /tmp/nmccarthy-project-jul-26
                          cd /tmp/nmccarthy-project-jul-26
                          kubectl apply -f k8s/namespace.yaml
                          kubectl wait --for=jsonpath='{.status.phase}'=Active namespace/nmccarthy-project-jul-26 --timeout=60s
                          kubectl apply -f k8s/deployment.yaml -f k8s/service.yaml
                          kubectl rollout restart deployment/nmccarthy-project-jul-26 -n nmccarthy-project-jul-26
                          kubectl rollout status deployment/nmccarthy-project-jul-26 -n nmccarthy-project-jul-26 --timeout=120s
              - step:
                  name: Wait 1 hour before undeploy
                  identifier: wait_before_undeploy
                  type: Wait
                  timeout: 65m
                  spec:
                    duration: 1h
              - step:
                  name: Undeploy from Kubernetes
                  identifier: k8s_delete
                  type: ShellScript
                  timeout: 10m
                  spec:
                    shell: Bash
                    onDelegate: true
                    delegateSelectors:
                      - nmccarth-rancher-desktop-delegate
                    source:
                      type: Inline
                      spec:
                        script: |
                          set -e
                          kubectl delete namespace nmccarthy-project-jul-26 --wait=true --ignore-not-found
                          echo "Undeployed nmccarthy-project-jul-26 from Rancher Desktop Kubernetes"
            rollbackSteps:
              - step:
                  name: Rollback Rollout Deployment
                  identifier: rollbackRolloutDeployment
                  type: K8sRollingRollback
                  timeout: 10m
                  spec:
                    pruningEnabled: false
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
